<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STRINGOLAND — platforma</title>
<style>
:root{--bg:#f7f3f0;--card:#fff;--ink:#1c1817;--muted:#756c67;--line:#e5ddd8;--accent:#171312;--soft:#efe8e4;--ok:#176b45;--warn:#9a6500;--bad:#a22f2f;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:rgba(247,243,240,.96);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.08em}.top-actions{display:flex;gap:8px;align-items:center}.wrap{max-width:1180px;margin:auto;padding:28px 18px 80px}.hero{padding:44px 0 25px;display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.95;margin:0 0 16px}.hero p{font-size:17px;color:var(--muted);max-width:650px}.btn{padding:11px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}.btn.alt{background:var(--soft);color:var(--ink)}.btn.danger{background:#8f2929}.btn.ok{background:#176b45}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 5px 22px #241a1208}.offer{min-height:220px;display:flex;flex-direction:column;justify-content:space-between}.photo{height:140px;border-radius:14px;background:linear-gradient(135deg,#e9ded8,#c9b9b0);display:grid;place-items:center;font-weight:800;color:#fff;font-size:24px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:var(--soft);font-size:11px;font-weight:700}.pill.ok{background:#e2f2e9;color:var(--ok)}.pill.warn{background:#fff1ce;color:var(--warn)}.pill.bad{background:#f9dfdf;color:var(--bad)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{margin-top:28px}.section h2{margin:0 0 12px}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{background:var(--accent);color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px}.box h2{margin-top:0}.close{float:right;border-radius:50%;width:32px;height:32px;background:var(--soft)}label{display:block;font-weight:700;font-size:12px;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}textarea{min-height:100px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px}.stat b{display:block;font-size:23px}.list{display:grid;gap:9px}.list-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.notice{padding:12px;border-radius:12px;background:#f1ece9;margin:10px 0}.empty{text-align:center;padding:30px;color:var(--muted)}.adminnav{display:flex;gap:7px;flex-wrap:wrap}.right{text-align:right}@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.table{font-size:12px}.top{padding:10px}.wrap{padding:20px 12px 60px}}
</style>
</head>
<body>
<header class="top"><div class="brand">STRINGOLAND</div><div id="topActions" class="top-actions"></div></header>
<main class="wrap">
<section id="home">
<div class="hero"><div><div class="pill">PROTOTYP FUNKCJONALNY</div><h1>Odkrywaj. Kupuj. Twórz.</h1><p>Platforma z ofertami, zamówieniami, weryfikacją sprzedających, portfelem, wypłatami i panelem administratora.</p><div class="actions"><button class="btn" onclick="showOffers()">Przeglądaj oferty</button><button class="btn alt" onclick="openAuth('register')">Załóż konto</button></div></div><div class="card"><h3>Tryb demonstracyjny</h3><p class="muted">Wszystkie dane są przechowywane lokalnie w tej przeglądarce. Możesz od razu przetestować trzy role.</p><button class="btn small" onclick="seedDemo()">Utwórz konta demo</button><div id="demoInfo" class="notice hidden"></div></div></div>
</section>
<section id="offersSection" class="section"><div class="row"><h2>Oferty</h2><button class="btn alt small" onclick="showHome()">Wróć</button></div><div id="offers" class="grid"></div></section>

<section id="appSection" class="hidden section">
<div class="row"><div><span id="rolePill" class="pill"></span><h2 id="appTitle"></h2></div><button class="btn alt small" onclick="logout()">Wyloguj</button></div>
<div id="appContent"></div>
</section>
</main>

<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>

<script>
"use strict";
const KEY="stringoland_v1";
const DEMO_PASS="demo123456789";
const COMMISSION=.24;
const state={user:null,tab:"home"};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{"accounts":[],"offers":[],"orders":[],"payouts":[],"verifications":[],"reports":[],"notifications":[],"audit":[],"buyerReviews":[],"messages":[]}')}catch(e){return {accounts:[],offers:[],orders:[],payouts:[],verifications:[],reports:[],notifications:[],audit:[],buyerReviews:[],messages:[]}}}
let db=load();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(p){return p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return new Intl.NumberFormat("pl-PL",{style:"currency",currency:"PLN"}).format(Number(n)||0)}
function me(){return state.user}
function account(){return me()?db.accounts.find(x=>x.id===me().id):null}
function notify(user,text){db.notifications.push({id:id("n"),user,text,read:false,at:new Date().toISOString()});save()}
function audit(action,detail=""){db.audit.push({id:id("a"),admin:me()?.name||"system",action,detail,at:new Date().toISOString()});save()}
function openModal(html){document.getElementById("modalContent").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function openAuth(mode="login"){openModal(`<h2>${mode==="login"?"Zaloguj się":"Załóż konto"}</h2><form onsubmit="submitAuth(event,'${mode}')">
<label>E-mail</label><input id="authEmail" type="email" required>
${mode==="register"?`<label>Imię / pseudonim</label><input id="authName" required><label>Rola</label><select id="authRole"><option value="buyer">Kupująca</option><option value="seller">Sprzedająca</option></select>`:""}
<label>Hasło</label><input id="authPass" type="password" minlength="8" required>
<button class="btn" style="margin-top:14px" type="submit">${mode==="login"?"Zaloguj":"Utwórz konto"}</button>
<button type="button" class="btn alt" style="margin-top:8px" onclick="openAuth('${mode==="login"?"register":"login"}')">${mode==="login"?"Nie mam konta":"Mam już konto"}</button></form>`)}
function submitAuth(e,mode){e.preventDefault();const email=document.getElementById("authEmail").value.trim().toLowerCase(),pass=document.getElementById("authPass").value;
if(mode==="login"){const a=db.accounts.find(x=>x.email===email&&x.password===pass);if(!a)return alert("Nieprawidłowy e-mail lub hasło.");state.user={id:a.id};localStorage.setItem("stringoland_session",a.id);closeModal();render();return}
const name=document.getElementById("authName").value.trim(),role=document.getElementById("authRole").value;
if(db.accounts.some(x=>x.email===email))return alert("Ten e-mail jest już zajęty.");
const a={id:id("u"),email,password:pass,name,role,createdAt:new Date().toISOString(),verifiedEmail:true,verifiedSeller:role==="buyer"?true:false,active:true};
db.accounts.push(a);if(role==="seller")db.verifications.push({id:id("v"),seller:a.id,status:"pending",submittedAt:new Date().toISOString()});save();state.user={id:a.id};localStorage.setItem("stringoland_session",a.id);closeModal();render()}
function seedDemo(){if(!db.accounts.some(x=>x.email==="kupujacy@example.test")){const b={id:"demo_b",email:"kupujacy@example.test",password:DEMO_PASS,name:"KupujacaDemo",role:"buyer",verifiedEmail:true,verifiedSeller:true,active:true};const s={id:"demo_s",email:"sprzedajaca@example.test",password:DEMO_PASS,name:"SprzedajacaDemo",role:"seller",verifiedEmail:true,verifiedSeller:true,active:true,bio:"Zweryfikowana sprzedająca demo",photos:[]};const a={id:"demo_a",email:"admin@example.test",password:DEMO_PASS,name:"AdministratorDemo",role:"admin",verifiedEmail:true,verifiedSeller:true,active:true};db.accounts.push(b,s,a);db.verifications.push({id:id("v"),seller:s.id,status:"approved",submittedAt:new Date().toISOString(),reviewedAt:new Date().toISOString(),reviewedBy:a.id});db.offers.push({id:id("o"),seller:s.id,title:"Oferta demonstracyjna",description:"Przykładowa oferta do testowania całego procesu.",price:49,photos:[],active:true,createdAt:new Date().toISOString()});save()}
document.getElementById("demoInfo").classList.remove("hidden");document.getElementById("demoInfo").textContent="Kupująca: kupujacy@example.test · Sprzedająca: sprzedajaca@example.test · Admin: admin@example.test · hasło: "+DEMO_PASS}
function logout(){state.user=null;localStorage.removeItem("stringoland_session");render()}
function showHome(){document.getElementById("home").classList.remove("hidden");document.getElementById("offersSection").classList.add("hidden");document.getElementById("appSection").classList.add("hidden")}
function showOffers(){document.getElementById("home").classList.add("hidden");document.getElementById("offersSection").classList.remove("hidden");document.getElementById("appSection").classList.add("hidden");renderOffers()}
function renderOffers(){const box=document.getElementById("offers"), offers=db.offers.filter(o=>o.active!==false&&db.accounts.find(a=>a.id===o.seller)?.active!==false&&db.accounts.find(a=>a.id===o.seller)?.verifiedSeller);box.innerHTML=offers.length?offers.map(o=>{const s=db.accounts.find(a=>a.id===o.seller);return `<article class="card offer"><div><div class="photo">${o.photos?.[0]?`<img src="${o.photos[0]}">`:"STRINGOLAND"}</div><h3>${esc(o.title)}</h3><p class="muted">${esc(o.description)}</p><span class="pill ok">✓ Zweryfikowana</span></div><div class="row"><b>${money(o.price)}</b><button class="btn small" onclick="openOffer('${o.id}')">Zobacz</button></div></article>`}).join(""):'<div class="card empty">Brak aktywnych ofert.</div>'}
function openOffer(oid){const o=db.offers.find(x=>x.id===oid),s=db.accounts.find(a=>a.id===o.seller);openModal(`<h2>${esc(o.title)}</h2><p class="muted">Sprzedająca: ${esc(s.name)}</p><p>${esc(o.description)}</p><h3>${money(o.price)}</h3>${me()?.role==="buyer"?`<button class="btn" onclick="placeOrder('${oid}')">Zamów</button>`:`<button class="btn" onclick="openAuth('login')">Zaloguj się, aby zamówić</button>`}`)}
function placeOrder(oid){const o=db.offers.find(x=>x.id===oid);if(!me()||me().role!=="buyer")return openAuth("login");const order={id:id("ord"),buyer:me().id,seller:o.seller,offer:o.id,title:o.title,gross:Number(o.price),commission:Number(o.price)*COMMISSION,net:Number(o.price)*(1-COMMISSION),status:"new",createdAt:new Date().toISOString()};db.orders.push(order);save();notify(o.seller,"Nowe zamówienie: "+o.title);closeModal();alert("Zamówienie zostało utworzone.");render()}
function render(){const sid=localStorage.getItem("stringoland_session");if(sid&&!state.user)state.user={id:sid};document.getElementById("topActions").innerHTML=me()?`<span class="pill">${esc(account()?.name)}</span><button class="btn small" onclick="openApp()">Panel</button>`:`<button class="btn alt small" onclick="openAuth('login')">Logowanie</button><button class="btn small" onclick="openAuth('register')">Rejestracja</button>`;renderOffers();if(me())openApp();else showHome()}
function openApp(){document.getElementById("home").classList.add("hidden");document.getElementById("offersSection").classList.add("hidden");document.getElementById("appSection").classList.remove("hidden");const a=account();document.getElementById("rolePill").textContent=a.role==="admin"?"ADMIN":a.role==="seller"?"SPRZEDAJĄCA":"KUPUJĄCA";document.getElementById("appTitle").textContent="Panel "+(a.role==="admin"?"administratora":a.role==="seller"?"sprzedającej":"kupującej");a.role==="seller"?sellerPanel():a.role==="admin"?adminPanel():buyerPanel()}
function nav(items){return `<div class="tabs">${items.map(([k,t])=>`<button class="btn alt small ${state.tab===k?"active":""}" onclick="state.tab='${k}';openApp()">${t}</button>`).join("")}</div>`}
function buyerPanel(){const a=account();if(!["orders","profile","notifications"].includes(state.tab))state.tab="orders";let html=nav([["orders","Zamówienia"],["profile","Profil"],["notifications","Powiadomienia"]]);if(state.tab==="orders")html+=buyerOrders(a);if(state.tab==="profile")html+=profileEditor(a);if(state.tab==="notifications")html+=notifications(a);document.getElementById("appContent").innerHTML=html}
function buyerOrders(a){const os=db.orders.filter(o=>o.buyer===a.id);return `<div class="section"><div class="stats"><div class="stat"><span>Wszystkie</span><b>${os.length}</b></div><div class="stat"><span>Nowe</span><b>${os.filter(o=>o.status==="new").length}</b></div><div class="stat"><span>W realizacji</span><b>${os.filter(o=>o.status==="in_progress").length}</b></div><div class="stat"><span>Zakończone</span><b>${os.filter(o=>o.status==="completed").length}</b></div></div><div class="list section">${os.length?os.map(o=>orderRow(o,a.role)).join(""):'<div class="empty">Nie masz jeszcze zamówień.</div>'}</div></div>`}
function orderRow(o,role){return `<div class="list-item"><div class="row"><div><b>${esc(o.title)}</b><div class="muted">${money(o.gross)} · prowizja 24%: ${money(o.commission)}</div></div><span class="pill ${o.status==="completed"?"ok":o.status==="cancelled"?"bad":"warn"}">${o.status==="new"?"Nowe":o.status==="in_progress"?"W realizacji":o.status==="completed"?"Zakończone":"Anulowane"}</span></div><div class="actions" style="margin-top:9px">${role==="seller"&&o.status==="new"?`<button class="btn small" onclick="startOrder('${o.id}')">Przyjmij</button>`:""}${role==="seller"&&o.status==="in_progress"?`<button class="btn ok small" onclick="completeOrder('${o.id}')">Zakończ</button>`:""}${role==="buyer"&&o.status==="completed"?`<button class="btn alt small" onclick="review('${o.id}')">Oceń</button>`:""}</div></div>`}
function profileEditor(a){return `<div class="card section"><h3>Profil</h3><label>Nazwa / pseudonim</label><input id="profileName" value="${esc(a.name)}"><label>Opis</label><textarea id="profileBio">${esc(a.bio||"")}</textarea><button class="btn" style="margin-top:10px" onclick="saveProfile()">Zapisz</button></div>`}
function saveProfile(){const a=account();a.name=document.getElementById("profileName").value.trim()||a.name;a.bio=document.getElementById("profileBio").value;save();render()}
function notifications(a){const ns=db.notifications.filter(n=>n.user===a.id).sort((x,y)=>y.at.localeCompare(x.at));return `<div class="list section">${ns.length?ns.map(n=>`<div class="list-item"><b>${esc(n.text)}</b><div class="muted">${new Date(n.at).toLocaleString("pl-PL")}</div></div>`).join(""):'<div class="empty">Brak powiadomień.</div>'}</div>`}
function sellerPanel(){const a=account();if(!["dashboard","profile","offers","orders","wallet","notifications","verification"].includes(state.tab))state.tab="dashboard";let html=nav([["dashboard","Start"],["profile","Profil"],["offers","Oferty"],["orders","Zamówienia"],["wallet","Portfel"],["verification","Weryfikacja"],["notifications","Powiadomienia"]]);if(state.tab==="dashboard")html+=sellerDashboard(a);if(state.tab==="profile")html+=profileEditor(a)+sellerPhotos(a);if(state.tab==="offers")html+=sellerOffers(a);if(state.tab==="orders")html+=sellerOrders(a);if(state.tab==="wallet")html+=sellerWallet(a);if(state.tab==="verification")html+=sellerVerification(a);if(state.tab==="notifications")html+=notifications(a);document.getElementById("appContent").innerHTML=html}
function sellerDashboard(a){const os=db.orders.filter(o=>o.seller===a.id),net=os.filter(o=>o.status==="completed").reduce((x,o)=>x+o.net,0);return `<div class="stats"><div class="stat"><span>Zamówienia</span><b>${os.length}</b></div><div class="stat"><span>Zakończone</span><b>${os.filter(o=>o.status==="completed").length}</b></div><div class="stat"><span>Zarobione netto</span><b>${money(net)}</b></div><div class="stat"><span>Weryfikacja</span><b>${a.verifiedSeller?"✓":"…"}</b></div></div>`}
function sellerPhotos(a){return `<div class="card section"><h3>Zdjęcia profilowe</h3><input id="profilePhoto" type="file" accept="image/*" multiple><button class="btn small" style="margin-top:8px" onclick="savePhotos()">Dodaj zdjęcia</button><div class="actions" style="margin-top:10px">${(a.photos||[]).map(x=>`<img src="${x}" style="width:90px;height:90px;object-fit:cover;border-radius:12px">`).join("")}</div></div>`}
function savePhotos(){const files=[...document.getElementById("profilePhoto").files];if(files.length>6)return alert("Maksymalnie 6 zdjęć.");Promise.all(files.map(readImage)).then(xs=>{const a=account();a.photos=[...(a.photos||[]),...xs].slice(0,6);save();sellerPanel()})}
function readImage(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
function sellerOffers(a){const os=db.offers.filter(o=>o.seller===a.id);return `<div class="row"><h3>Moje oferty</h3>${a.verifiedSeller?`<button class="btn small" onclick="offerForm()">+ Dodaj ofertę</button>`:""}</div>${!a.verifiedSeller?'<div class="notice">Oferty będą dostępne po ręcznej weryfikacji administratora.</div>':''}<div class="grid">${os.map(o=>`<div class="card"><h3>${esc(o.title)}</h3><p>${esc(o.description)}</p><b>${money(o.price)}</b><div class="actions" style="margin-top:10px"><button class="btn alt small" onclick="offerForm('${o.id}')">Edytuj</button><button class="btn danger small" onclick="deleteOffer('${o.id}')">Usuń</button></div></div>`).join("")||'<div class="empty">Brak ofert.</div>'}</div>`}
function offerForm(oid){const o=oid?db.offers.find(x=>x.id===oid):{title:"",description:"",price:""};openModal(`<h2>${oid?"Edytuj ofertę":"Dodaj ofertę"}</h2><label>Tytuł</label><input id="ofTitle" value="${esc(o.title)}"><label>Opis</label><textarea id="ofDesc">${esc(o.description)}</textarea><label>Cena (PLN)</label><input id="ofPrice" type="number" min="1" step=".01" value="${o.price||""}"><button class="btn" style="margin-top:12px" onclick="saveOffer('${oid||""}')">Zapisz</button>`)}
function saveOffer(oid){const a=account();if(!a.verifiedSeller)return alert("Najpierw przejdź weryfikację.");const title=document.getElementById("ofTitle").value.trim(),description=document.getElementById("ofDesc").value.trim(),price=Number(document.getElementById("ofPrice").value);if(!title||!description||price<=0)return alert("Uzupełnij dane oferty.");if(oid){const o=db.offers.find(x=>x.id===oid);Object.assign(o,{title,description,price})}else db.offers.push({id:id("o"),seller:a.id,title,description,price,photos:[],active:true,createdAt:new Date().toISOString()});save();closeModal();sellerPanel();renderOffers()}
function deleteOffer(oid){if(!confirm("Usunąć ofertę?"))return;db.offers=db.offers.filter(x=>x.id!==oid);save();sellerPanel();renderOffers()}
function sellerOrders(a){const os=db.orders.filter(o=>o.seller===a.id);return `<div class="list section">${os.length?os.map(o=>orderRow(o,"seller")).join(""):'<div class="empty">Brak zamówień.</div>'}</div>`}
function startOrder(oid){const o=db.orders.find(x=>x.id===oid);if(!o||o.seller!==me().id)return;o.status="in_progress";o.startedAt=new Date().toISOString();save();notify(o.buyer,"Sprzedająca przyjęła zamówienie do realizacji.");sellerPanel()}
function completeOrder(oid){const o=db.orders.find(x=>x.id===oid);if(!o||o.seller!==me().id)return;o.status="completed";o.completedAt=new Date().toISOString();save();notify(o.buyer,"Zamówienie zostało zakończone.");sellerPanel()}
function sellerWallet(a){const completed=db.orders.filter(o=>o.seller===a.id&&o.status==="completed"),gross=completed.reduce((x,o)=>x+o.gross,0),net=completed.reduce((x,o)=>x+o.net,0),paid=db.payouts.filter(x=>x.seller===a.id&&x.status==="paid").reduce((x,p)=>x+p.amount,0),pending=db.payouts.filter(x=>x.seller===a.id&&x.status==="pending").reduce((x,p)=>x+p.amount,0),available=Math.max(0,net-paid-pending);return `<div class="stats"><div class="stat"><span>Sprzedaż brutto</span><b>${money(gross)}</b></div><div class="stat"><span>Prowizja 24%</span><b>${money(gross*COMMISSION)}</b></div><div class="stat"><span>Do wypłaty</span><b>${money(available)}</b></div><div class="stat"><span>Oczekujące</span><b>${money(pending)}</b></div></div><div class="card section"><h3>Dane do wypłaty</h3><label>Imię i nazwisko</label><input id="bankName" value="${esc(a.bankName||"")}"><label>Numer rachunku</label><input id="bankAccount" inputmode="numeric" value="${esc(a.bankAccount||"")}"><button class="btn small" style="margin-top:10px" onclick="saveBank()">Zapisz dane</button><button class="btn ok small" style="margin:10px 0 0 6px" onclick="requestPayout()">Zleć wypłatę</button></div><div class="list section">${db.payouts.filter(x=>x.seller===a.id).sort((x,y)=>y.at.localeCompare(x.at)).map(p=>`<div class="list-item"><div class="row"><b>${money(p.amount)}</b><span class="pill ${p.status==="paid"?"ok":p.status==="rejected"?"bad":"warn"}">${p.status==="paid"?"Wypłacona":p.status==="rejected"?"Odrzucona":"Oczekuje"}</span></div>${p.reason?`<small>Powód: ${esc(p.reason)}</small>`:""}</div>`).join("")||'<div class="empty">Brak historii wypłat.</div>'}</div>`}
function saveBank(){const a=account();a.bankName=document.getElementById("bankName").value.trim();a.bankAccount=document.getElementById("bankAccount").value.replace(/\s/g,"");if(!/^\d{20,30}$/.test(a.bankAccount))return alert("Wpisz poprawny numer rachunku.");save();alert("Dane zapisane.")}
function requestPayout(){const a=account();const completed=db.orders.filter(o=>o.seller===a.id&&o.status==="completed"),net=completed.reduce((x,o)=>x+o.net,0),paid=db.payouts.filter(p=>p.seller===a.id&&p.status==="paid").reduce((x,p)=>x+p.amount,0),pending=db.payouts.filter(p=>p.seller===a.id&&p.status==="pending").reduce((x,p)=>x+p.amount,0),amount=Math.max(0,net-paid-pending);if(!a.bankAccount)return alert("Najpierw zapisz dane rachunku.");if(amount<1)return alert("Brak środków do wypłaty.");db.payouts.push({id:id("p"),seller:a.id,amount,status:"pending",at:new Date().toISOString()});save();notifyAdmin("Nowa wypłata do obsłużenia: "+money(amount));alert("Wypłata zlecona.");sellerPanel()}
function notifyAdmin(text){db.accounts.filter(a=>a.role==="admin").forEach(a=>notify(a.id,text))}
function sellerVerification(a){const v=db.verifications.find(x=>x.seller===a.id);return `<div class="card section"><h3>Weryfikacja sprzedającej</h3><p>Status: <span class="pill ${a.verifiedSeller?"ok":v?.status==="rejected"?"bad":"warn"}">${a.verifiedSeller?"Zatwierdzona":v?.status==="rejected"?"Odrzucona":"Oczekuje na ręczną weryfikację"}</span></p>${!a.verifiedSeller?`<p class="muted">Administrator sprawdza konto ręcznie. Do czasu zatwierdzenia nie możesz publikować ofert.</p><button class="btn alt small" onclick="verificationForm()">Uzupełnij dane</button>`:"<p>Możesz korzystać z ofert i zamówień.</p>"}</div>`}
function verificationForm(){openModal(`<h2>Weryfikacja sprzedającej</h2><p>W prototypie przesyłasz dane do ręcznego sprawdzenia administratora.</p><label>Imię i nazwisko</label><input id="verName"><label>Opis działalności</label><textarea id="verDesc"></textarea><button class="btn" style="margin-top:10px" onclick="submitVerification()">Wyślij do weryfikacji</button>`)}
function submitVerification(){const v=db.verifications.find(x=>x.seller===me().id);if(v){v.status="pending";v.submittedAt=new Date().toISOString();v.name=document.getElementById("verName").value;v.description=document.getElementById("verDesc").value}else db.verifications.push({id:id("v"),seller:me().id,status:"pending",submittedAt:new Date().toISOString()});save();notifyAdmin("Nowy wniosek o weryfikację sprzedającej.");closeModal();sellerPanel()}
function adminPanel(){if(!["dashboard","verification","sellers","orders","payouts","moderation","audit"].includes(state.tab))state.tab="dashboard";let html=nav([["dashboard","Start"],["verification","Weryfikacje"],["sellers","Sprzedające"],["orders","Zamówienia"],["payouts","Wypłaty"],["moderation","Zgłoszenia"],["audit","Dziennik"]]);if(state.tab==="dashboard")html+=adminDashboard();if(state.tab==="verification")html+=adminVerification();if(state.tab==="sellers")html+=adminSellers();if(state.tab==="orders")html+=adminOrders();if(state.tab==="payouts")html+=adminPayouts();if(state.tab==="moderation")html+=adminModeration();if(state.tab==="audit")html+=adminAudit();document.getElementById("appContent").innerHTML=html}
function adminDashboard(){const sellers=db.accounts.filter(a=>a.role==="seller"),pending=db.verifications.filter(v=>v.status==="pending").length,p=db.payouts.filter(x=>x.status==="pending").length;return `<div class="stats"><div class="stat"><span>Sprzedające</span><b>${sellers.length}</b></div><div class="stat"><span>Weryfikacje</span><b>${pending}</b></div><div class="stat"><span>Wypłaty</span><b>${p}</b></div><div class="stat"><span>Zamówienia</span><b>${db.orders.length}</b></div></div>`}
function adminVerification(){const vs=db.verifications;return `<div class="list section">${vs.length?vs.map(v=>{const a=db.accounts.find(x=>x.id===v.seller);return `<div class="list-item"><div class="row"><div><b>${esc(a?.name||"—")}</b><div class="muted">${v.status} · ${v.submittedAt?new Date(v.submittedAt).toLocaleString("pl-PL"):""}</div></div><div class="actions">${v.status==="pending"?`<button class="btn ok small" onclick="approve('${v.id}')">Zatwierdź</button><button class="btn danger small" onclick="reject('${v.id}')">Odrzuć</button>`:""}</div></div></div>`}).join(""):'<div class="empty">Brak wniosków.</div>'}</div>`}
function approve(vid){const v=db.verifications.find(x=>x.id===vid),a=db.accounts.find(x=>x.id===v.seller);v.status="approved";v.reviewedAt=new Date().toISOString();v.reviewedBy=me().id;a.verifiedSeller=true;save();notify(a.id,"Twoja weryfikacja została zatwierdzona.");audit("Zatwierdzenie sprzedającej",a.name);adminPanel()}
function reject(vid){const reason=prompt("Powód odrzucenia:","Uzupełnij brakujące dane.");if(reason===null)return;const v=db.verifications.find(x=>x.id===vid),a=db.accounts.find(x=>x.id===v.seller);v.status="rejected";v.reason=reason;v.reviewedAt=new Date().toISOString();v.reviewedBy=me().id;a.verifiedSeller=false;save();notify(a.id,"Weryfikacja odrzucona. Powód: "+reason);audit("Odrzucenie weryfikacji",a.name+" · "+reason);adminPanel()}
function adminSellers(){return `<table class="table"><thead><tr><th>Sprzedająca</th><th>Status</th><th>Oferty</th><th>Aktywność</th></tr></thead><tbody>${db.accounts.filter(a=>a.role==="seller").map(a=>`<tr><td>${esc(a.name)}</td><td>${a.verifiedSeller?"Zatwierdzona":"Niezweryfikowana"}</td><td>${db.offers.filter(o=>o.seller===a.id).length}</td><td><button class="btn ${a.active?"danger":"ok"} small" onclick="toggleSeller('${a.id}')">${a.active?"Dezaktywuj":"Aktywuj"}</button></td></tr>`).join("")}</tbody></table>`}
function toggleSeller(uid){const a=db.accounts.find(x=>x.id===uid);a.active=!a.active;save();audit(a.active?"Aktywacja sprzedającej":"Dezaktywacja sprzedającej",a.name);adminPanel();renderOffers()}
function adminOrders(){return `<table class="table"><thead><tr><th>Zamówienie</th><th>Strony</th><th>Kwota</th><th>Status</th></tr></thead><tbody>${db.orders.map(o=>{const b=db.accounts.find(a=>a.id===o.buyer),s=db.accounts.find(a=>a.id===o.seller);return `<tr><td>${esc(o.title)}</td><td>${esc(b?.name)} → ${esc(s?.name)}</td><td>${money(o.gross)}</td><td>${o.status}</td></tr>`}).join("")}</tbody></table>`}
function adminPayouts(){const ps=db.payouts.filter(p=>p.status==="pending");return `<div class="list">${ps.length?ps.map(p=>{const a=db.accounts.find(x=>x.id===p.seller);return `<div class="list-item"><div class="row"><div><b>${esc(a?.name)}</b><div>${money(p.amount)} · •••• ${(a?.bankAccount||"").slice(-4)}</div></div><div class="actions"><button class="btn ok small" onclick="pay('${p.id}')">Wypłacone</button><button class="btn danger small" onclick="denyPayout('${p.id}')">Odrzuć</button></div></div></div>`}).join(""):'<div class="empty">Brak oczekujących wypłat.</div>'}</div><div class="section"><h3>Historia</h3><div class="list">${db.payouts.filter(p=>p.status!=="pending").map(p=>`<div class="list-item">${money(p.amount)} · ${p.status}${p.reason?" · "+esc(p.reason):""}</div>`).join("")}</div></div>`}
function pay(pid){const p=db.payouts.find(x=>x.id===pid);p.status="paid";p.paidAt=new Date().toISOString();save();const a=db.accounts.find(x=>x.id===p.seller);notify(a.id,"Wypłata "+money(p.amount)+" została zrealizowana.");audit("Wypłata zrealizowana",a.name+" · "+money(p.amount));adminPanel()}
function denyPayout(pid){const reason=prompt("Powód odrzucenia:","Nieprawidłowe dane do wypłaty.");if(reason===null)return;const p=db.payouts.find(x=>x.id===pid);p.status="rejected";p.reason=reason;save();const a=db.accounts.find(x=>x.id===p.seller);notify(a.id,"Wypłata odrzucona: "+reason);audit("Odrzucenie wypłaty",a.name+" · "+reason);adminPanel()}
function adminModeration(){return `<div class="list">${db.reports.length?db.reports.map(r=>`<div class="list-item"><b>${esc(r.reason)}</b><div class="muted">Zgłaszający: ${esc(r.reporter)}</div><button class="btn ok small" onclick="resolveReport('${r.id}')">Rozpatrz</button></div>`).join(""):'<div class="empty">Brak zgłoszeń.</div>'}</div>`}
function resolveReport(rid){const r=db.reports.find(x=>x.id===rid);r.status="resolved";r.resolvedAt=new Date().toISOString();save();audit("Rozpatrzenie zgłoszenia",r.reason);notify(r.reporter,"Twoje zgłoszenie zostało rozpatrzone.");adminPanel()}
function adminAudit(){return `<div class="actions"><button class="btn small" onclick="exportData()">Eksport danych</button><button class="btn danger small" onclick="resetDemo()">Wyczyść dane</button></div><div class="list section">${db.audit.slice().reverse().map(x=>`<div class="list-item"><b>${esc(x.action)}</b><div>${esc(x.detail)}</div><small>${new Date(x.at).toLocaleString("pl-PL")}</small></div>`).join("")||'<div class="empty">Brak wpisów.</div>'}</div>`}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="stringoland-backup.json";a.click();URL.revokeObjectURL(u);audit("Eksport danych")}
function resetDemo(){if(!confirm("Wyczyścić wszystkie dane tej wersji demonstracyjnej?"))return;localStorage.removeItem(KEY);db=load();state.user=null;render()}
function review(oid){const o=db.orders.find(x=>x.id===oid);openModal(`<h2>Oceń sprzedającą</h2><label>Ocena</label><select id="reviewScore"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>Opinia</label><textarea id="reviewText"></textarea><button class="btn" style="margin-top:10px" onclick="saveReview('${oid}')">Opublikuj</button>`)}
function saveReview(oid){const o=db.orders.find(x=>x.id===oid),score=Number(document.getElementById("reviewScore").value),text=document.getElementById("reviewText").value;db.buyerReviews.push({id:id("r"),order:oid,seller:o.seller,buyer:o.buyer,score,text,at:new Date().toISOString()});save();notify(o.seller,"Kupująca wystawiła Ci opinię.");closeModal();alert("Dziękujemy za opinię.");}
function resetUI(){state.tab="home";render()}
document.addEventListener("DOMContentLoaded",()=>{renderOffers();render()});
</script>
</body></html>
